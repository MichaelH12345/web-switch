<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed Website Switcher</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        .website {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.5s ease;
        }

        /* MAIN WEBSITE */
        #mainWebsite {
            opacity: 1;
            z-index: 1;
            pointer-events: auto;
        }

        /* TIMED WEBSITE */
        #timedWebsite {
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- MAIN WEBSITE -->
    <iframe
        id="mainWebsite"
        class="website"
        src="https://michaelh12345.github.io/dual_web/">
    </iframe>

    <!-- TIMED WEBSITE -->
    <iframe
        id="timedWebsite"
        class="website"
        src="https://michaelh12345.github.io/depart_screen_adverts">
    </iframe>


    <script>

        const mainWebsite = document.getElementById("mainWebsite");
        const timedWebsite = document.getElementById("timedWebsite");

        const timedURL =
            "https://michaelh12345.github.io/depart_screen_adverts";

        let showingTimed = false;
        let lastRefreshMinute = -1;
        let lastSwitchMinute = -1;


        // ==================================================
        // REFRESH TIMED WEBSITE AT XX:44.5
        // ==================================================

        function checkRefresh() {

            const now = new Date();

            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();
            const minute = now.getMinutes();

            /*
                Refresh between:

                XX:44.500
                and
                XX:44.749

                This gives us a small window so the browser
                doesn't need to hit the exact millisecond.
            */

            if (
                seconds === 44 &&
                milliseconds >= 500 &&
                milliseconds < 750 &&
                minute !== lastRefreshMinute
            ) {

                lastRefreshMinute = minute;

                // Reload the timed website
                timedWebsite.src = timedURL;
            }
        }


        // ==================================================
        // SWITCH TO TIMED WEBSITE AT XX:45
        // ==================================================

        function switchToTimed() {

            if (showingTimed) return;

            showingTimed = true;

            // Fade main website out
            mainWebsite.style.opacity = "0";
            mainWebsite.style.pointerEvents = "none";


            // After the 0.5 second fade,
            // show the freshly refreshed timed website
            setTimeout(() => {

                timedWebsite.style.opacity = "1";

                // Timed website is interactive
                timedWebsite.style.pointerEvents = "auto";

            }, 500);


            // ==================================================
            // KEEP TIMED WEBSITE ON SCREEN FOR 10 SECONDS
            // ==================================================

            setTimeout(() => {

                // Disable interaction
                timedWebsite.style.pointerEvents = "none";

                // Fade timed website out
                timedWebsite.style.opacity = "0";


                // Fade main website back in
                setTimeout(() => {

                    mainWebsite.style.opacity = "1";
                    mainWebsite.style.pointerEvents = "auto";

                    showingTimed = false;

                }, 500);

            }, 10500);
        }


        // ==================================================
        // CHECK REAL CLOCK
        // ==================================================

        function checkTime() {

            const now = new Date();

            const seconds = now.getSeconds();
            const minute = now.getMinutes();


            // Trigger at XX:45
            if (
                seconds === 45 &&
                minute !== lastSwitchMinute &&
                !showingTimed
            ) {

                lastSwitchMinute = minute;

                switchToTimed();
            }
        }


        // Check the clock very frequently
        setInterval(() => {

            checkRefresh();
            checkTime();

        }, 50);

    </script>

</body>
</html>
